[project]
name = "llm-command-center"
version = "0.1.0"
description = "A lean, extensible TUI that orchestrates multiple AI coding agents through configurable pipelines"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "textual>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.80"]
openai = ["openai>=1.60"]
web = ["starlette>=0.37", "uvicorn[standard]>=0.30"]
all = ["anthropic>=0.80", "openai>=1.60", "starlette>=0.37", "uvicorn[standard]>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
llm-cc = "llm_cc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cc"]
# Built web frontend is gitignored; include it explicitly so it ships in the wheel.
artifacts = ["src/llm_cc/web/static/**"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

# Optional extras — lazily imported and guarded at the call site, so they are
# absent from the default dev environment.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
